# 改进版 YOLOv8 检测结构：在关键位置插入 CBAM 注意力
#
# 与原始 yolov8.yaml 的差异（共 3 处）：
#   1. backbone 末端 SPPF 之后插入 CBAM      —— 强化 P5 的语义聚合
#   2. P3 输出 C2f 之后插入 CBAM             —— 小目标分支，占全图 34.6% 的目标依赖它
#   3. P4 输出 C2f 之后插入 CBAM             —— 中等目标分支
#
# 层号相对原始结构有位移，head 中的 Concat 引用已同步修正，不可照抄原文件。

nc: 4
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1  P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3  P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5  P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7  P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 1, CBAM, []]                # 10 新增：backbone 末端注意力

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 融合 P4
  - [-1, 3, C2f, [512]]                          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 融合 P3
  - [-1, 3, C2f, [256]]                          # 16 P3/8-small
  - [-1, 1, CBAM, []]                            # 17 新增：小目标分支注意力

  - [-1, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 13], 1, Concat, [1]]                   # 19 融合 P4
  - [-1, 3, C2f, [512]]                          # 20 P4/16-medium
  - [-1, 1, CBAM, []]                            # 21 新增：中目标分支注意力

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 10], 1, Concat, [1]]                   # 23 融合 P5（注意引用 10 而非原 9）
  - [-1, 3, C2f, [1024]]                         # 24 P5/32-large

  - [[17, 21, 24], 1, Detect, [nc]]              # 25
